spring.application.name=skillswap-backend
server.port=8080

# Database Configuration (H2 In-Memory with MySQL compatibility)
spring.datasource.url=jdbc:h2:mem:skillswap_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# App JWT Configuration
app.jwt.secret=SkillSwapSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong
app.jwt.expiration-ms=86400000
